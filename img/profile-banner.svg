<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Dhika Fatturrahman Ghany — Full-Stack Engineer · DevOps</title>
  <desc id="banner-description">An illustrative API client window titled Dhika Fatturrahman Ghany, with a D monogram as its app icon. It sends GET /api/me and receives a 200 OK JSON response: name Dhika, role Full-Stack Engineer · DevOps, ships web apps, APIs, and CI/CD pipelines, open to full-time and collaboration, based in Cimahi, Indonesia. It is an illustration, not a real endpoint or live status.</desc>
  <style>
    svg { width: 100%; height: auto; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .json { font-size: 20px; }
    .k { fill: #7DD3FC; } .s { fill: #7EE787; } .p { fill: #94A3B8; }
    .mobile { display: none; }
    .type { animation: type steps(7) 0.3s 0.15s both; }
    .reveal { animation: reveal 0.25s ease-out both; }
    .press { animation: press 0.25s ease-out 0.45s both; }
    .spinner { transform-box: fill-box; transform-origin: center; animation: spin 0.3s linear 0.5s, vanish 0.01s 0.8s both; opacity: 0; }
    .live { animation: blink 1.6s ease-in-out 2s infinite; }
    @keyframes type { to { transform: translateX(75.6px); } }
    @keyframes reveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes press { 0% { fill: #4DC9D4; } 50% { fill: #A5F3FC; } 100% { fill: #4DC9D4; } }
    @keyframes spin { from { opacity: 1; transform: rotate(0); } to { opacity: 1; transform: rotate(360deg); } }
    @keyframes vanish { to { opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @media (max-width: 600px) {
      .desktop { display: none; }
      .mobile { display: inline; }
    }
    @media (prefers-reduced-motion: reduce) {
      .type, .reveal, .press, .live { animation: none; opacity: 1; transform: none; }
      .type, .spinner { display: none; }
    }
  </style>
  <defs>
    <g id="monogram-mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0H12A16 16 0 0 1 12 32H0Z" stroke="#4DC9D4" stroke-width="4" />
      <path d="M5 10.5L10.5 16L5 21.5" stroke="#7EE787" stroke-width="3.5" />
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="468" rx="16" fill="#0D1422" stroke="#26364C" />

  <!-- desktop layout -->
  <g class="desktop">
    <!-- title bar: identity is static, visible from the first frame -->
    <g class="monogram">
      <rect x="40" y="20" width="52" height="52" rx="12" fill="#0F2530" stroke="#26364C" />
      <use href="#monogram-mark" x="51" y="30" />
    </g>
    <text x="110" y="57" font-size="32" font-weight="700" fill="#E6EDF3">Dhika Fatturrahman Ghany</text>
    <text x="960" y="53" text-anchor="end" font-size="14" fill="#506680">api client</text>
    <path d="M40 92H960" stroke="#26364C" />

    <!-- request bar -->
    <rect x="40" y="112" width="800" height="48" rx="10" fill="#111B2D" stroke="#26364C" />
    <rect x="52" y="122" width="62" height="28" rx="6" fill="#123326" />
    <text x="83" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#7EE787">GET</text>
    <text x="132" y="143" font-size="18" textLength="75.6" lengthAdjust="spacing" fill="#E6EDF3">/api/me</text>
    <rect class="type" x="130" y="120" width="90" height="32" fill="#111B2D" />
    <rect class="press" x="856" y="112" width="104" height="48" rx="10" fill="#4DC9D4" />
    <text x="908" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0D1422">Send</text>

    <!-- status -->
    <text x="40" y="203" font-size="12" letter-spacing="1.5" fill="#506680">RESPONSE</text>
    <circle class="spinner" cx="140" cy="199" r="8" fill="none" stroke="#4DC9D4" stroke-width="2.5" stroke-dasharray="30 60" />
    <g class="reveal" style="animation-delay: 0.8s;">
      <rect x="128" y="185" width="82" height="24" rx="12" fill="#123326" />
      <circle class="live" cx="142" cy="197" r="4" fill="#7EE787" />
      <text x="154" y="202" font-size="13" font-weight="700" fill="#7EE787">200 OK</text>
      <text x="226" y="202" font-size="13" fill="#94A3B8">42 ms · application/json</text>
    </g>
    <path d="M40 224H960" stroke="#26364C" />

    <!-- body -->
    <g class="json">
      <g font-size="15" fill="#506680" text-anchor="end">
        <text class="reveal" x="62" y="262" style="animation-delay: 0.9s;">1</text>
        <text class="reveal" x="62" y="292" style="animation-delay: 1.0s;">2</text>
        <text class="reveal" x="62" y="322" style="animation-delay: 1.1s;">3</text>
        <text class="reveal" x="62" y="352" style="animation-delay: 1.2s;">4</text>
        <text class="reveal" x="62" y="382" style="animation-delay: 1.3s;">5</text>
        <text class="reveal" x="62" y="412" style="animation-delay: 1.4s;">6</text>
        <text class="reveal" x="62" y="442" style="animation-delay: 1.5s;">7</text>
      </g>
      <text class="reveal p" x="84" y="262" style="animation-delay: 0.9s;">{</text>
      <text class="reveal" x="84" y="292" style="animation-delay: 1.0s;" xml:space="preserve"><tspan class="k">  "name"</tspan><tspan class="p">: </tspan><tspan class="s">"Dhika"</tspan><tspan class="p">,</tspan></text>
      <text class="reveal" x="84" y="322" style="animation-delay: 1.1s;" xml:space="preserve"><tspan class="k">  "role"</tspan><tspan class="p">: </tspan><tspan class="s" font-weight="700">"Full-Stack Engineer · DevOps"</tspan><tspan class="p">,</tspan></text>
      <text class="reveal" x="84" y="352" style="animation-delay: 1.2s;" xml:space="preserve"><tspan class="k">  "ships"</tspan><tspan class="p">: [</tspan><tspan class="s">"web apps"</tspan><tspan class="p">, </tspan><tspan class="s">"APIs"</tspan><tspan class="p">, </tspan><tspan class="s">"CI/CD pipelines"</tspan><tspan class="p">],</tspan></text>
      <text class="reveal" x="84" y="382" style="animation-delay: 1.3s;" xml:space="preserve"><tspan class="k">  "open_to"</tspan><tspan class="p">: [</tspan><tspan class="s">"full-time"</tspan><tspan class="p">, </tspan><tspan class="s">"collaboration"</tspan><tspan class="p">],</tspan></text>
      <text class="reveal" x="84" y="412" style="animation-delay: 1.4s;" xml:space="preserve"><tspan class="k">  "based_in"</tspan><tspan class="p">: </tspan><tspan class="s">"Cimahi, ID"</tspan></text>
      <text class="reveal p" x="84" y="442" style="animation-delay: 1.5s;">}</text>
    </g>
  </g>

  <!-- mobile layout: larger type, no request bar -->
  <g class="mobile">
    <g class="monogram">
      <rect x="40" y="28" width="76" height="76" rx="16" fill="#0F2530" stroke="#26364C" />
      <use href="#monogram-mark" transform="translate(56 42) scale(1.5)" />
    </g>
    <text x="140" y="70" font-size="38" font-weight="700" fill="#E6EDF3">Dhika Fatturrahman</text>
    <text x="140" y="108" font-size="38" font-weight="700" fill="#E6EDF3">Ghany</text>
    <path d="M40 136H960" stroke="#26364C" />
    <g class="reveal" style="animation-delay: 0.3s;">
      <rect x="40" y="160" width="290" height="40" rx="20" fill="#123326" />
      <circle class="live" cx="66" cy="180" r="7" fill="#7EE787" />
      <text x="84" y="189" font-size="24" font-weight="700" fill="#7EE787">200 OK · /api/me</text>
    </g>
    <g font-size="28">
      <text class="reveal" x="40" y="250" style="animation-delay: 0.5s;" xml:space="preserve"><tspan class="k">"role"</tspan><tspan class="p">:</tspan></text>
      <text class="reveal s" x="70" y="290" font-weight="700" style="animation-delay: 0.6s;">"Full-Stack Engineer · DevOps"</text>
      <text class="reveal" x="40" y="340" style="animation-delay: 0.7s;" xml:space="preserve"><tspan class="k">"open_to"</tspan><tspan class="p">:</tspan></text>
      <text class="reveal s" x="70" y="380" style="animation-delay: 0.8s;">["full-time", "collaboration"]</text>
      <text class="reveal" x="40" y="430" style="animation-delay: 0.9s;" xml:space="preserve"><tspan class="k">"based_in"</tspan><tspan class="p">: </tspan><tspan class="s">"Cimahi, ID"</tspan></text>
    </g>
  </g>
</svg>
